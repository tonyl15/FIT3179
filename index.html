<!DOCTYPE html>
<html lang="en">
<head>
    <title>FIT3179 Visualisation 2</title>
    <script src="https://cdn.jsdelivr.net/npm/vega@5.20.2"></script>
    <script src="https://cdn.jsdelivr.net/npm/vega-lite@5.1.0"></script>
    <script src="https://cdn.jsdelivr.net/npm/vega-embed@6.17.0"></script>

    <!-- CSS file -->
    <link rel="stylesheet" type="text/css" href="css/styles.css" media="all">
</head>

<body>
    <div class="main-container">
        <div id="world_map"></div>
        <div id="inflation_chart"></div>
    </div>
    
    <script type="text/javascript">
        const spec1 = "js/world_map.vg.json";
        const spec2 = "js/inflation_rate.vg.json";
        
        vegaEmbed('#world_map', spec1).then(function(result) {
            // Access the Vega view instance (https://vega.github.io/vega/docs/api/view/) as result.view
        }).catch(console.error);

        vegaEmbed('#inflation_chart', spec2).then(function(result) {
            // Access the Vega view instance (https://vega.github.io/vega/docs/api/view/) as result.view
        }).catch(console.error);
    </script>

</body>
</html>
